[workspace]
resolver = "3"
members = ["crates/chorus-core", "crates/chorus-ffi", "crates/chorus-server", "crates/chorus-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Vayne Altapascine"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Web builds: the bundle budget is bytes over the wire (SPEC §9), so optimise every crate for
# size — only in `--profile wasm` builds; the server keeps `release`.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
