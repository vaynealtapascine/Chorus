// PluralSpec v0.1 draft — shared value types.
//
// Field-number convention used by every record in this package:
//   1–9      common header (id, created_at, updated_at, deleted_at, archived_at)
//   10–899   the record's own fields
//   900–999  preservation (source_refs = 900, ext = 901)
// Numbers are never reused; removed fields are `reserved`.
//
// `ext` (901) on every record is `map<string, google.protobuf.Struct>`: app- or spec-namespaced
// data that has no PluralSpec field, keyed by a registered app id or a reverse-DNS name.
// "pluralspec" is reserved for the spec itself.
syntax = "proto3";

package pluralspec.v1;

// A reference to the same record in the app it came from. Several are allowed when a
// record has travelled through more than one app.
message SourceRef {
  // Registered app id ("pluralkit", "simply_plural", "chorus", …) or a reverse-DNS name.
  string app = 1;
  // The source app's collection or table ("members", "switches", "frontHistory").
  string collection = 2;
  // The source primary key, as a string.
  string id = 3;
  // A second stable id when the source has one (PluralKit exposes both a short id and a UUID).
  string uuid = 4;
}

// A calendar date where any part may be unknown. 0 means unknown.
// {year: 0, month: 4, day: 2} is "2 April, year unknown".
message PartialDate {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

message DateRange {
  PartialDate start = 1;
  PartialDate end = 2;
}

// Formatted text. Exactly one form is set. Readers MUST handle all three: render them, or at
// least fall back to the plain characters (markdown source, or EntityText.text).
message RichText {
  oneof body {
    // No formatting.
    string plain = 1;
    // PluralSpec markdown: CommonMark + GFM tables, strikethrough and task lists,
    // `||spoiler||`, and `pluralspec:` links for mentions and custom emoji (SPEC.md §2.6).
    string markdown = 2;
    // Plain text plus formatting spans (the Telegram / Chorus model).
    EntityText entities = 3;
  }
}

message EntityText {
  string text = 1;
  repeated Span spans = 2;
}

// A formatting range over EntityText.text, in the file's text offset unit
// (Manifest.text_offset_unit; UTF-16 code units unless it says otherwise).
message Span {
  SpanType type = 1;
  uint32 offset = 2;
  uint32 length = 3;
  // TEXT_LINK: the target. MENTION / CUSTOM_EMOJI: a pluralspec: URI (pluralspec:member/<id>).
  string url = 4;
  // PRE: the code language, if known.
  string language = 5;
}

enum SpanType {
  SPAN_TYPE_UNSPECIFIED = 0;
  SPAN_TYPE_BOLD = 1;
  SPAN_TYPE_ITALIC = 2;
  SPAN_TYPE_UNDERLINE = 3;
  SPAN_TYPE_STRIKETHROUGH = 4;
  SPAN_TYPE_SPOILER = 5;
  SPAN_TYPE_CODE = 6;
  SPAN_TYPE_PRE = 7;
  SPAN_TYPE_BLOCKQUOTE = 8;
  SPAN_TYPE_URL = 9;
  SPAN_TYPE_TEXT_LINK = 10;
  SPAN_TYPE_MENTION = 11;
  SPAN_TYPE_CUSTOM_EMOJI = 12;
  SPAN_TYPE_HEADING = 13;
}

// How every text position in a file (spans, message segments, quotes) is counted.
enum TextOffsetUnit {
  // Read as UTF16.
  TEXT_OFFSET_UNIT_UNSPECIFIED = 0;
  // UTF-16 code units (JavaScript, Kotlin/Java, Telegram, Chorus).
  TEXT_OFFSET_UNIT_UTF16 = 1;
  // UTF-8 bytes (Rust, Go).
  TEXT_OFFSET_UNIT_UTF8 = 2;
}

// Who may see something. Empty (no classes, no members) means only the system itself.
message Audience {
  // Visible to everyone in any of these VisibilityClass records.
  repeated string class_ids = 1;
  // A soft, in-system limit: only these members of the system. When set, class_ids MUST be
  // empty (the thing is not shared outside the system at all).
  repeated string member_ids = 2;
}

// A link shown on a profile.
message Link {
  string label = 1;
  string url = 2;
}

// What can front, be grouped, be labelled or be the subject of a custom field.
message SubjectRef {
  oneof subject {
    string member_id = 1;
    string group_id = 2;
    string state_id = 3;
    string system_id = 4;
  }
}
