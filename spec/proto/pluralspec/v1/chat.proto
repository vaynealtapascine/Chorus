// PluralSpec v0.1 draft — optional module "chat": a system's channels and the messages its
// members send in them. Earlier versions of edited messages are history events (record.proto).
// Spaces shared between several accounts are server-side and out of scope; a system's export
// may still carry the channels and messages it can read, marked with Channel.shared.
syntax = "proto3";

package pluralspec.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "pluralspec/v1/common.proto";

message Channel {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.Timestamp deleted_at = 4;
  google.protobuf.Timestamp archived_at = 5;

  string system_id = 10;
  ChannelKind kind = 11;
  string name = 12;
  RichText topic = 13;
  // A label that groups channels in a list.
  string category = 14;
  string emoji = 15;
  string color = 16;
  string sort_key = 17;
  // DIRECT channels: the members talking. Other kinds: empty means the whole system.
  repeated string participant_member_ids = 18;
  // THREAD channels: the message the thread hangs from.
  string thread_root_message_id = 19;
  // The channel belongs to a space shared with other accounts; messages from outside the
  // system appear with MessageAuthor.external set.
  bool shared = 20;
  Audience audience = 21;

  repeated SourceRef source_refs = 900;
  map<string, google.protobuf.Struct> ext = 901;
}

enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_KIND_TEXT = 1;
  CHANNEL_KIND_THREAD = 2;
  // Between chosen members of the system.
  CHANNEL_KIND_DIRECT = 3;
  // Topic-per-post discussion.
  CHANNEL_KIND_FORUM = 4;
  // A log of messages proxied elsewhere (PluralKit, Tupperbox).
  CHANNEL_KIND_PROXY_LOG = 5;
}

message Message {
  string id = 1;
  // When it was sent.
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.Timestamp deleted_at = 4;

  string channel_id = 10;
  MessageKind kind = 11;
  // Who says it. Several authors speak it jointly. Empty for a system notice.
  repeated MessageAuthor authors = 12;
  RichText body = 13;
  // Parts of the body said by other authors (see SPEC.md §7.3). Ranges are over the body's
  // plain characters, in the file's text offset unit, and do not overlap.
  repeated Segment segments = 14;
  optional sint32 utc_offset_minutes = 15;
  string reply_to_message_id = 16;
  Quote quote = 17;
  // A message forwarded from elsewhere: what it looked like when forwarded.
  repeated MessageSnapshot forwarded = 18;
  string content_warning = 19;
  repeated string attachment_asset_ids = 20;
  google.protobuf.Timestamp edited_at = 21;
  google.protobuf.Timestamp pinned_at = 22;
  // Narrower than the channel: e.g. only chosen members (AUDIENCE_TIER_MEMBERS).
  Audience audience = 23;

  repeated SourceRef source_refs = 900;
  map<string, google.protobuf.Struct> ext = 901;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_TEXT = 1;
  // Generated by an app ("Kai pinned a message").
  MESSAGE_KIND_NOTICE = 2;
  MESSAGE_KIND_VOICE = 3;
  MESSAGE_KIND_VIDEO = 4;
}

message MessageAuthor {
  oneof author {
    string member_id = 1;
    // Someone outside the system, in a shared channel.
    ExternalAuthor external = 2;
  }
}

message ExternalAuthor {
  string display_name = 1;
  string contact_id = 2;
  repeated SourceRef source_refs = 3;
}

message Segment {
  uint32 offset = 1;
  uint32 length = 2;
  repeated MessageAuthor authors = 3;
}

message Quote {
  string message_id = 1;
  // The quoted part, when not the whole message.
  uint32 offset = 2;
  uint32 length = 3;
  // The quoted text at the time, in case the original changes or goes.
  RichText text = 4;
}

message MessageSnapshot {
  string message_id = 1;
  string channel_name = 2;
  repeated MessageAuthor authors = 3;
  RichText body = 4;
  google.protobuf.Timestamp sent_at = 5;
}

// An image emoji referred to as pluralspec:emoji/<id>.
message CustomEmoji {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.Timestamp deleted_at = 4;

  // Without colons: "blobwave".
  string name = 10;
  repeated string aliases = 11;
  string category = 12;
  string asset_id = 13;

  repeated SourceRef source_refs = 900;
  map<string, google.protobuf.Struct> ext = 901;
}
