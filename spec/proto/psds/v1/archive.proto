// PSDS v0.1 draft — assets, the archive (manifest + records) and the import report.
syntax = "proto3";

package psds.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "psds/v1/chat.proto";
import "psds/v1/common.proto";
import "psds/v1/content.proto";
import "psds/v1/fields.proto";
import "psds/v1/front.proto";
import "psds/v1/system.proto";

// A file: an avatar, a banner, an attachment, a custom emoji image.
message Asset {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.Timestamp deleted_at = 4;

  // Lowercase hex SHA-256 of the bytes. In a container, the bytes are at blobs/sha256/<hex>.
  string sha256 = 10;
  string mime_type = 11;
  uint64 size_bytes = 12;
  string file_name = 13;
  uint32 width = 14;
  uint32 height = 15;
  uint32 duration_ms = 16;
  string alt_text = 17;
  bool spoiler = 18;
  // Where the bytes can be fetched when they are not in the file (fragile; see SPEC.md §8).
  string uri = 19;
  // The bytes themselves: single-document JSON files only.
  bytes data = 20;

  repeated SourceRef source_refs = 900;
  map<string, google.protobuf.Struct> ext = 901;
}

// The manifest: first in every file, readable without the rest.
message Manifest {
  // The PSDS version the file follows, "0.1.0".
  string psds_version = 1;
  google.protobuf.Timestamp exported_at = 2;
  Producer producer = 3;
  // The modules this file fills (SPEC.md §3.3): "core", "fronting", "fields", "posts", …
  repeated string modules = 4;
  ExportProfile profile = 5;
  // Records per type, e.g. {"member": 42}.
  map<string, uint64> counts = 6;
  // What the producer could not export, or exported degraded.
  repeated Warning warnings = 7;
  // The ids of the systems this file is about (a file may hold several).
  repeated string system_ids = 8;
  // How the records are stored in this file (SPEC.md §3).
  BodyEncoding body_encoding = 9;
  // SHA-256 of the body file in a container, lowercase hex.
  string body_sha256 = 10;

  map<string, google.protobuf.Struct> ext = 901;
}

message Producer {
  // Display name: "Chorus".
  string app = 1;
  // Registered short id: "chorus".
  string app_id = 2;
  string app_version = 3;
  // Version of the exporter when separate from the app.
  string exporter_version = 4;
}

enum ExportProfile {
  EXPORT_PROFILE_UNSPECIFIED = 0;
  // Everything, including private data: a backup, or moving to another app.
  EXPORT_PROFILE_FULL = 1;
  // Only what the chosen audience may see, for giving to someone else (SPEC.md §10.2).
  EXPORT_PROFILE_SHARED = 2;
}

enum BodyEncoding {
  BODY_ENCODING_UNSPECIFIED = 0;
  // data.jsonl: one Record per line, canonical JSON.
  BODY_ENCODING_JSON_LINES = 1;
  // data.binpb: Records as length-delimited protobuf (varint length prefix).
  BODY_ENCODING_PROTOBUF_DELIMITED = 2;
  // The file is one JSON Archive document (no container).
  BODY_ENCODING_JSON_DOCUMENT = 3;
}

message Warning {
  WarningLevel level = 1;
  // Registered code (SPEC.md §9.3): "module_not_supported", "asset_uri_only", …
  string code = 2;
  // The Record type it concerns ("member", "front_span"), if any.
  string record_type = 3;
  string record_id = 4;
  string message = 5;
  // When it stands for several records.
  uint64 count = 6;
}

enum WarningLevel {
  WARNING_LEVEL_UNSPECIFIED = 0;
  WARNING_LEVEL_INFO = 1;
  // Something was degraded or kept only as archive data.
  WARNING_LEVEL_WARNING = 2;
  // Something was lost.
  WARNING_LEVEL_ERROR = 3;
}

// One record of any type: a line of data.jsonl, or one delimited message of data.binpb.
message Record {
  oneof record {
    System system = 1;
    Member member = 2;
    State state = 3;
    Group group = 4;
    GroupMembership group_membership = 5;
    Label label = 6;
    LabelAssignment label_assignment = 7;
    Bucket bucket = 8;
    FieldDefinition field_definition = 9;
    FieldValue field_value = 10;
    Asset asset = 11;

    FrontSpan front_span = 20;
    FrontSwitch front_switch = 21;
    FrontComment front_comment = 22;

    Post post = 30;
    Reaction reaction = 31;
    RelationshipType relationship_type = 32;
    Relationship relationship = 33;
    Contact contact = 34;
    Poll poll = 35;
    Vote vote = 36;

    Channel channel = 40;
    Message message = 41;
    MessageRevision message_revision = 42;
    CustomEmoji custom_emoji = 43;
  }
}

// The single-document form: a manifest and every record, grouped by type. Same records as the
// stream form; readers MUST accept both.
message Archive {
  Manifest manifest = 1;

  repeated System systems = 10;
  repeated Member members = 11;
  repeated State states = 12;
  repeated Group groups = 13;
  repeated GroupMembership group_memberships = 14;
  repeated Label labels = 15;
  repeated LabelAssignment label_assignments = 16;
  repeated Bucket buckets = 17;
  repeated FieldDefinition field_definitions = 18;
  repeated FieldValue field_values = 19;
  repeated Asset assets = 20;

  repeated FrontSpan front_spans = 30;
  repeated FrontSwitch front_switches = 31;
  repeated FrontComment front_comments = 32;

  repeated Post posts = 40;
  repeated Reaction reactions = 41;
  repeated RelationshipType relationship_types = 42;
  repeated Relationship relationships = 43;
  repeated Contact contacts = 44;
  repeated Poll polls = 45;
  repeated Vote votes = 46;

  repeated Channel channels = 50;
  repeated Message messages = 51;
  repeated MessageRevision message_revisions = 52;
  repeated CustomEmoji custom_emoji = 53;
}

// What an importer reports after reading a file (SPEC.md §9.4).
message ImportReport {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp finished_at = 2;
  // The imported file's manifest, without counts and warnings.
  Manifest source = 3;
  ModuleCounts totals = 4;
  map<string, ModuleCounts> per_module = 5;
  repeated Warning warnings = 6;
}

message ModuleCounts {
  // New records created.
  uint64 imported = 1;
  // Records matched to existing ones (same id or source ref) and updated.
  uint64 merged = 2;
  // Records already present and unchanged.
  uint64 unchanged = 3;
  // Imported with something dropped or simplified.
  uint64 degraded = 4;
  // Kept only as archive data the app cannot show.
  uint64 archived_only = 5;
  // Deliberately not imported.
  uint64 skipped = 6;
  uint64 failed = 7;
}
