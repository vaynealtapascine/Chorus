[package]
name = "chorus-server"
description = "Chorus server: op log, projections, sync, API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chorus-core = { path = "../chorus-core" }
clap = { version = "4.6.7", features = ["derive"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["trace", "cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
tokio-tungstenite = "0.30.0"
