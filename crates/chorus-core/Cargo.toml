[package]
name = "chorus-core"
description = "Pure domain logic shared by the Chorus server, Android app and web app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Native editor source maps; deliberately not linked into the size-bounded WASM API.
editor = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
proptest = "1"
